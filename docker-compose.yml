version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: visika
      POSTGRES_USER: visika_user
      POSTGRES_PASSWORD: visika_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=visika.settings.local
      - DATABASE_URL=postgres://visika_user:visika_password@db:5432/visika
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - ALLOWED_HOSTS=127.0.0.1,localhost,0.0.0.0
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A visika worker --loglevel=INFO
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=visika.settings.local
      - DATABASE_URL=postgres://visika_user:visika_password@db:5432/visika
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
